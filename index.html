<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>De Otra Época</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Georgia, serif; color: #2d2019; background: #f4ead7; }
    .hero { min-height: 80vh; padding: 28px 8vw 70px; color: #fff8e9; background: linear-gradient(90deg, rgba(25,15,12,.82) 0%, rgba(25,15,12,.54) 42%, rgba(25,15,12,.08) 76%), url('hero-barrio-90s-v2.png') center / cover no-repeat; }
    nav { display:flex; justify-content:space-between; align-items:center; font-family:Arial,sans-serif; text-transform:uppercase; letter-spacing:.1em; font-size:13px; }
    .brand { font-weight:bold; font-size:18px; }
    .links { display:flex; gap:22px; }
    main { max-width:760px; margin-top:115px; }
    h1 { font-size:clamp(64px,11vw,126px); line-height:.84; margin:0; letter-spacing:-.075em; text-transform:uppercase; text-shadow:3px 3px 0 rgba(113,55,34,.55); }
    .tagline { margin:18px 0 0; font-family:Arial,sans-serif; font-size:clamp(18px,2.6vw,28px); font-weight:900; letter-spacing:.13em; text-transform:uppercase; color:#e4b44f; }
    .intro { max-width:520px; font-size:21px; line-height:1.45; margin:26px 0 30px; }
    button { border:0; background:#e4b44f; color:#302116; padding:14px 20px; cursor:pointer; font-weight:bold; letter-spacing:.06em; text-transform:uppercase; }
    section { padding:60px 8vw; max-width:1200px; margin:auto; }
    h2 { font-size:38px; margin:0 0 14px; }
    .lead { max-width:650px; font-size:19px; line-height:1.5; }
    .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:32px; }
    .card { background:#fff8ea; border-top:4px solid #a75432; padding:24px; min-height:160px; }
    .card h3 { margin:0 0 12px; font-size:24px; }
    .card p { margin:0; line-height:1.45; }
    .story { padding-top:0; }
    .story-wrap { display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:36px; align-items:start; }
    .story-image { width:100%; display:block; border:8px solid #fff8ea; box-shadow:0 10px 28px rgba(45,32,25,.2); }
    .story-copy { font-size:18px; line-height:1.65; }
    .story-copy p { margin:0 0 18px; }
    .story-copy h2 { margin-top:0; }
    footer { background:#2d2019; color:#f4ead7; padding:32px 8vw; font-size:15px; }
    @media(max-width:650px) { .links{display:none} .cards{grid-template-columns:1fr} .hero{min-height:650px} .story-wrap{grid-template-columns:1fr} .story-copy{font-size:17px;} }
  </style>
</head>
<body>
  <header class="hero">
